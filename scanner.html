<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}

<script>
var D={},selOp='',store='',gsrWorks=false;
var DEPLOY_URL='https://script.google.com/macros/s/AKfycbyvJXJoFMrqaVCyQP1vTfEFD1Gfp98KmS-X-nyEysThExNpSA-C8CWbPi46V3YDHfqY/exec';


// ═══════════════════════════════════════════════════════════════
//  3) QR ÉRTELMEZÉS — ÚJ RÖVID ÉS RÉGI FORMS URL EGYARÁNT
//  A már kinyomtatott címkéken a régi, hosszú Forms URL van,
//  ezért mindkettőt fel kell ismerni. Visszafelé kompatibilis.
// ═══════════════════════════════════════════════════════════════
function parseTubQR(text){
  text=(text||'').toString().trim();
  if(!text)return null;
  // ÚJ:  Íz|Gyártási szám|Súly
  if(text.indexOf('|')!==-1&&text.slice(0,4).toLowerCase()!=='http'){
    var pp=text.split('|');
    var r={flavor:(pp[0]||'').trim(),batch:(pp[1]||'').trim(),weight:(pp[2]||'').trim()};
    return (r.flavor&&r.batch)?r:null;
  }
  // RÉGI: Google Forms előkitöltött URL
  try{
    var q=new URL(text).searchParams;
    var o={flavor:(decodeURIComponent(q.get('entry.1429792248')||'')).trim(),
           batch:(decodeURIComponent(q.get('entry.2015076910')||'')).trim(),
           weight:(decodeURIComponent(q.get('entry.2000996021')||'')).trim()};
    return (o.flavor&&o.batch)?o:null;
  }catch(e){return null;}
}

// ═══════════════════════════════════════════════════════════════
//  6) TÖBB ÉRZÉKSZERVI VISSZAJELZÉS
//  A dolgozó ne a képernyőt fürkéssze — érezze és hallja is.
//  Ez akadályozza meg, hogy visszajelzés híján újra nyomkodjon.
// ═══════════════════════════════════════════════════════════════
var _actx=null;
function _beep(freq,dur,type,vol){
  try{
    if(!_actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;_actx=new AC();}
    if(_actx.state==='suspended'){_actx.resume();}
    var o=_actx.createOscillator(),g=_actx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,_actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.25,_actx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,_actx.currentTime+dur);
    o.connect(g);g.connect(_actx.destination);
    o.start();o.stop(_actx.currentTime+dur+0.02);
  }catch(e){}
}
function _vibe(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}}

// iOS Safari NEM támogatja a navigator.vibrate()-et. Mivel a csapat
// nagy része iPhone-t használ, ott a rezgést erősebb hanggal és
// hosszabb, keretes villanással kompenzáljuk. Androidon marad a rezgés.
var HAS_VIBE=(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function');
function fxSuccess(){
  if(HAS_VIBE){ _beep(1180,0.09,'sine'); setTimeout(function(){_beep(1560,0.10,'sine');},95); _vibe(200); }
  else{ // iPhone: háromhangú, hosszabb és hangosabb jelzés
    _beep(1046,0.16,'sine',0.5);
    setTimeout(function(){_beep(1318,0.16,'sine',0.5);},130);
    setTimeout(function(){_beep(1568,0.30,'sine',0.55);},265);
  }
}
function fxError(){
  if(HAS_VIBE){ _beep(320,0.28,'square'); _vibe([100,50,100]); }
  else{ _beep(300,0.34,'square',0.6);
        setTimeout(function(){_beep(240,0.42,'square',0.6);},300); }
}

// Teljes képernyős villanás nagy adatokkal
// Semleges (kék) beolvasás-visszajelzés — NEM siker-jelzés
function flashScan(fl,ba,we){
  var el=document.getElementById('fxFlash');
  if(!el){el=document.createElement('div');el.id='fxFlash';
    el.style.cssText='position:fixed;inset:0;z-index:100000;display:none;align-items:center;'
      +'justify-content:center;text-align:center;padding:22px;flex-direction:column;font-family:inherit;';
    document.body.appendChild(el);}
  el.style.background='rgba(10,45,95,.97)';
  el.innerHTML='<div style="font-size:60px;margin-bottom:10px;">📷</div>'
    +'<div style="font-size:19px;font-weight:800;color:#fff;margin-bottom:12px;">Beolvasva — válassz műveletet</div>'
    +'<div style="background:rgba(0,0,0,.3);border-radius:14px;padding:16px 20px;max-width:420px;width:100%;">'
    +'<div style="font-size:26px;font-weight:800;color:#fff;">'+fl+'</div>'
    +'<div style="font-size:15px;color:#cfe0ff;font-family:monospace;margin-top:4px;">'+ba+'</div>'
    +(we?'<div style="font-size:14px;color:#cfe0ff;margin-top:2px;">'+we+' g</div>':'')
    +'</div>';
  el.style.display='flex';
  setTimeout(function(){_beep(880,0.07,'sine');},0);
  clearTimeout(el._t); el._t=setTimeout(function(){el.style.display='none';},700);
}

function flash(ok,title,lines){
  var el=document.getElementById('fxFlash');
  if(!el){
    el=document.createElement('div');el.id='fxFlash';
    el.style.cssText='position:fixed;inset:0;z-index:100000;display:none;'
      +'align-items:center;justify-content:center;text-align:center;padding:22px;'
      +'flex-direction:column;font-family:inherit;';
    document.body.appendChild(el);
  }
  var bg=ok?'rgba(10,90,50,.97)':'rgba(120,15,15,.97)';
  var mark=ok?'✓':'✕';
  var h='<div style="font-size:96px;font-weight:900;color:#fff;line-height:1;margin-bottom:14px;">'+mark+'</div>'
       +'<div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:14px;">'+(title||'')+'</div>';
  if(lines&&lines.length){
    h+='<div style="background:rgba(0,0,0,.3);border-radius:14px;padding:16px 20px;max-width:420px;width:100%;">';
    lines.forEach(function(l){
      h+='<div style="font-size:'+(l.big?'26px':'15px')+';font-weight:'+(l.big?'800':'600')
        +';color:#fff;line-height:1.5;'+(l.mono?'font-family:monospace;':'')+'">'+l.text+'</div>';
    });
    h+='</div>';
  }
  // Rezgés nélküli készüléken (iPhone) a villanás hosszabb és a
  // képernyő teljes széle is villog — ez pótolja a hiányzó rezgést.
  el.style.background=bg;
  el.style.boxShadow = HAS_VIBE ? 'none'
    : 'inset 0 0 0 14px '+(ok?'#7CFFB2':'#FF7A7A');
  el.style.animation = HAS_VIBE ? 'none' : 'fxedge .42s ease-in-out 3';
  el.innerHTML=h;el.style.display='flex';
  // A hang/rezgés SOHA nem blokkolhatja a vizuális visszajelzést:
  // az első AudioContext létrehozása hidegen másodpercekig tarthat.
  setTimeout(function(){ if(ok)fxSuccess(); else fxError(); },0);
  clearTimeout(el._t);
  el._t=setTimeout(function(){el.style.display='none';},ok?900:1600);
}

// Gomb töltő állapot

// Az AudioContext előmelegítése az első érintésre, hogy a tényleges
// művelet pillanatában már ne kelljen létrehozni (hidegen ~1,8 mp).
(function(){
  function warm(){
    try{ if(!_actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)_actx=new AC();} }catch(e){}
    if(_actx&&_actx.state==='suspended'){try{_actx.resume();}catch(e){}}
    document.removeEventListener('touchstart',warm,true);
    document.removeEventListener('click',warm,true);
  }
  document.addEventListener('touchstart',warm,true);
  document.addEventListener('click',warm,true);
})();

function btnBusy(btn,on,busyLabel){
  if(!btn)return;
  if(on){
    if(!btn.dataset.orig)btn.dataset.orig=btn.innerHTML;
    btn.disabled=true;
    btn.innerHTML='<span class="fxspin"></span>'+(busyLabel||'Feldolgozás…');
  }else{
    btn.disabled=false;
    if(btn.dataset.orig){btn.innerHTML=btn.dataset.orig;btn.dataset.orig='';}
  }
}

var qrInst=null,camActive=false;
function startCam(){
  store=document.getElementById('sel').value;if(!store){toast('Valassz uzletet!',1);return}
  if(!qrInst)qrInst=new Html5Qrcode('qr-reader');
  var el=document.getElementById('qr-reader');
  var sb=document.getElementById('qrStopBtn');
  el.style.display='block';sb.style.display='block';
  qrInst.start({facingMode:'environment'},{fps:10,qrbox:function(vw,vh){var s=Math.floor(Math.min(vw,vh)*0.75);return{width:s,height:s};},experimentalFeatures:{useBarCodeDetectorIfSupported:true},videoConstraints:{facingMode:{exact:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}},
    function(text){stopCam();parseQR(text);},
    function(){}
  ).then(function(){camActive=true;setupZoom();}).catch(function(){
    el.style.display='none';sb.style.display='none';
    document.getElementById('qrFile').click();
  });
}
// Zoom — csak ha a kamera tamogatja (html5-qrcode track capabilities)
function setupZoom(){
  var wrap=document.getElementById('zoomWrap'),rng=document.getElementById('zoomRange');
  try{
    var caps=qrInst.getRunningTrackCapabilities();
    if(!caps||!caps.zoom){wrap.style.display='none';return;}
    rng.min=caps.zoom.min||1;rng.max=caps.zoom.max||5;
    rng.step=caps.zoom.step||0.1;rng.value=caps.zoom.min||1;
    wrap.style.display='block';
    rng.oninput=function(){
      try{qrInst.applyVideoConstraints({advanced:[{zoom:parseFloat(rng.value)}]});}catch(e){}
    };
  }catch(e){wrap.style.display='none';}
}

function stopCam(){
  var el=document.getElementById('qr-reader');var sb=document.getElementById('qrStopBtn');
  var zw=document.getElementById('zoomWrap');if(zw)zw.style.display='none';

// ═══════════════════════════════════════════════════════════════
//  KÜLDÉSI SOR (optimistic UI)
//  A dolgozó SOHA nem vár a szerverre: a gombnyomás pillanatában
//  megkapja a visszajelzést, a küldés a háttérben, sorban megy.
//  Sikertelenség esetén automatikus újrapróbálkozás; csak a
//  végleges kudarc után jelenik meg figyelmeztetés.
//  A backend 30 mp-es idempotencia-védelme a második biztosíték.
// ═══════════════════════════════════════════════════════════════
var Q=[], qBusy=false, qSeq=0;
var Q_RETRIES=4, Q_BACKOFF=[1000,3000,8000,20000];

function qLoad(){
  try{var r=localStorage.getItem('bruno_queue');if(r)Q=JSON.parse(r)||[];}catch(e){Q=[];}
}
function qSave(){ try{localStorage.setItem('bruno_queue',JSON.stringify(Q));}catch(e){} }

function qAdd(payload,label){
  qSeq++;
  var item={id:'q'+Date.now()+'_'+qSeq,payload:payload,label:label||'',
            state:'pending',tries:0};
  Q.push(item);qSave();qRender();qPump();
  return item;
}

function qPump(){
  if(qBusy)return;
  var next=null;
  for(var i=0;i<Q.length;i++){ if(Q[i].state==='pending'||Q[i].state==='retry'){next=Q[i];break;} }
  if(!next){qRender();return;}
  if(navigator.onLine===false){setNet(false);qRender();return;}
  qBusy=true;next.state='sending';qRender();
  fetch(DEPLOY_URL,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain'},body:JSON.stringify(next.payload)})
    .then(function(r){return r.json();})
    .then(function(res){
      qBusy=false;setNet(true);
      if(res&&res.ok===false){
        // A szerver ELUTASÍTOTTA (nem hálózati hiba) — nincs értelme újrapróbálni
        next.state='rejected';next.error=res.error||'A szerver elutasította.';
        next.wrongTool=res.wrongTool||'';
      } else {
        next.state='done';next.result=res;
      }
      qSave();qRender();setTimeout(qPump,60);
    })
    .catch(function(){
      qBusy=false;setNet(false);
      next.tries++;
      if(next.tries>=Q_RETRIES){ next.state='failed'; }
      else { next.state='retry'; setTimeout(qPump, Q_BACKOFF[next.tries-1]||20000); }
      qSave();qRender();
    });
}

function qStats(){
  var s={waiting:0,failed:0,rejected:0,done:0};
  Q.forEach(function(x){
    if(x.state==='pending'||x.state==='retry'||x.state==='sending')s.waiting++;
    else if(x.state==='failed')s.failed++;
    else if(x.state==='rejected')s.rejected++;
    else s.done++;
  });
  return s;
}

function qRender(){
  var s=qStats();
  var bar=document.getElementById('qBar');
  if(!bar){
    bar=document.createElement('div');bar.id='qBar';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9000;display:none;'
      +'padding:11px 14px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;'
      +'font-family:inherit;line-height:1.4;';
    document.body.appendChild(bar);
    bar.onclick=function(){
      Q.forEach(function(x){ if(x.state==='failed'){x.state='pending';x.tries=0;} });
      qSave();qRender();qPump();
    };
  }
  var bad=s.failed+s.rejected;
  if(bad>0){
    bar.style.display='block';
    bar.style.background='#c01818';bar.style.color='#fff';
    var txt='⚠️ '+bad+' művelet nem ment át';
    if(s.rejected>0&&s.failed===0)txt+=' — a szerver elutasította';
    else txt+=' — érintsd meg az újraküldéshez';
    bar.textContent=txt;
  } else if(s.waiting>0){
    bar.style.display='block';
    bar.style.background='#3a2a10';bar.style.color='#FAC775';
    bar.textContent=(navigator.onLine===false?'📴 Offline — ':'')+s.waiting+' művelet vár küldésre';
  } else {
    bar.style.display='none';
  }
  if(typeof qRenderList==='function')qRenderList();
  // takaritas: a regen kesz tetelek kivezetese
  if(Q.length>60)Q=Q.filter(function(x){return x.state!=='done';}).concat(Q.slice(-20));
}

// Net visszatereskor azonnal probaljuk ujra
window.addEventListener('online',function(){ Q.forEach(function(x){ if(x.state==='failed'){x.state='pending';x.tries=0;} }); qSave(); qPump(); });
setInterval(function(){ if(qStats().waiting>0)qPump(); },5000);
qLoad(); qRender(); qPump();

// ── 3) ÁLLANDÓ ONLINE/OFFLINE JELZŐ ────────────────────────────
// FONTOS: navigator.onLine NEM megbízható — iOS Safariban repülő
// üzemmódban is true-t ad. Ezért csak GYORS NEGATÍV jelzésként
// használjuk; az igazság a legutóbbi tényleges szerver-hívás
// eredménye (netOk), amit minden fetch frissít.
var netOk=null;
function isOffline(){
  if(navigator.onLine===false)return true;   // biztosan offline
  if(netOk===false)return true;              // a szerver ténylegesen nem elérhető
  return false;                              // netOk true vagy még ismeretlen
}
function setNet(ok){
  if(netOk===ok)return;
  netOk=ok;
  var el=document.getElementById('netInd');if(!el)return;
  el.className='netind '+(ok?'on':'off');
  document.getElementById('netTxt').textContent=ok?'Online':'Offline';
}
function pingServer(){
  if(navigator.onLine===false){setNet(false);return;}
  // navigator.onLine hazudhat -> tényleges szerver-hívás
  fetch(DEPLOY_URL+'?action=checkBatch&batch=__ping__',{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(){setNet(true);})
    .catch(function(){setNet(false);});
}
window.addEventListener('online',pingServer);
window.addEventListener('offline',function(){setNet(false);});
pingServer();
setInterval(pingServer,30000);

    google.script.run
      .withSuccessHandler(function(r){gsrWorks=true;})
      .withFailureHandler(function(){})
      .gsTest();
  }
}catch(e){}
